<style>
@keyframes faceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes kissHeart { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 50% { opacity: 1; transform: translate(25px, -20px) scale(1.1); } 100% { opacity: 0; transform: translate(45px, -45px) scale(0.9); } }
.face-group { animation: faceFloat 2.4s ease-in-out infinite; transform-origin: center; }
.kiss-heart { animation: kissHeart 2s ease-in-out infinite; transform-origin: 175px 150px; }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; } }
</style>
