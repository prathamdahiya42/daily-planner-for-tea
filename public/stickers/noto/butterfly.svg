<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
<style>
@keyframes wingFlapLeft { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.4); } }
@keyframes wingFlapRight { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.4); } }
.wing-left { animation: wingFlapLeft 1.2s ease-in-out infinite; transform-origin: 128px center; }
.wing-right { animation: wingFlapRight 1.2s ease-in-out infinite; transform-origin: 128px center; }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; } }
</style>
